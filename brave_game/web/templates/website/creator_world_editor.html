    let pendingGraphDraft = null;
    const GRID_SIZE = 56;
    const MAP_STEP = 170;
    const NODE_WIDTH = 142;
    const NODE_HEIGHT = 72;
    const GRAPH_MARGIN = 420;

    function setBusy(isBusy) {
      for (const button of [loadButton, diffRoomButton, writeRoomButton, ghostRoomButton, syncExitFormButton, newExitButton, diffExitButton, writeExitButton, syncEntityFormButton, newEntityButton, diffEntityButton, writeEntityButton, validateButton, reloadButton, fitGraphButton, connectRoomsButton, previewPathButton, writePathButton, museRoomDescButton, museEntityDescButton]) {
        if (button) button.disabled = isBusy;
      }
      writePositionButton.disabled = isBusy || !pendingRoomPosition;
    }

    function setStatus(message, tone = "") {
      creatorTools.setStatus(message, tone);
    }

    function showValidation(messages) {
      return creatorTools.showValidation(messages);
    }

    function clearValidation() {
      creatorTools.clearValidation();
    }

    function setEditorTab(tabName) {
      for (const button of editorTabButtons) {
        const active = button.dataset.editorTab === tabName;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      }
      for (const panel of editorTabPanels) {
        panel.classList.toggle("active", panel.dataset.editorPanel === tabName);
      }
    }

    function parseCsv(value) {
      return String(value || "").split(",").map((entry) => entry.trim()).filter(Boolean);
    }

    function formatCsv(values) {
      return Array.isArray(values) ? values.join(", ") : "";
    }

    function syncEntityKindFields() {
      const kind = entityKindSelect.value || "npc";
      for (const field of entityKindFields) {
        field.classList.toggle("active", field.dataset.kindField === kind);
      }
    }

    function fillRoomSelect(select, selectedValue = "", includeBlank = false) {
      const previous = selectedValue || select.value || "";
      select.innerHTML = "";
      if (includeBlank) {
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "Choose a room";
        if (!previous) blank.selected = true;
        select.appendChild(blank);
      }
      for (const room of rooms) {
        const option = document.createElement("option");
        option.value = room.id;
        option.textContent = `${room.label || room.id} (${room.id})`;
        if (room.id === previous) option.selected = true;
        select.appendChild(option);
      }
    }

    function fillAtmosphereSelect(selectedValue = "") {
      const roomId = roomIdInput.value || "";
      roomAtmosphereSelect.innerHTML = '<option value="">None</option>';
      for (const profile of atmosphereProfiles) {
        const option = document.createElement("option");
        option.value = profile.id;
        let label = profile.label;
        if (!selectedValue && (
          (roomId.startsWith("blackfen_") && profile.id === "blackfen_rain_fog") ||
          (roomId.startsWith("old_barrow_") && profile.id === "barrow_darkness") ||
          (roomId.startsWith("drowned_weir_") && profile.id === "drowned_wrong_light") ||
          (roomId.includes("chapel") && profile.id === "chapel_lamplight") ||
          (roomId.includes("observatory") && profile.id === "observatory_lampwork")
        )) {
          label += " (Recommended)";
        }
        option.textContent = label;
        roomAtmosphereSelect.appendChild(option);
      }
      roomAtmosphereSelect.value = selectedValue || "";
    }

    function getCookie(name) {
      const prefix = `${name}=`;
      for (const part of String(document.cookie || "").split(";")) {
        const trimmed = part.trim();
        if (trimmed.startsWith(prefix)) return trimmed.substring(prefix.length);
      }
      return "";
    }

    function roomRegion(room) {
      return room.map_region || room.zone || room.meta || "Unmapped";
    }

    async function apiFetch(path, options = {}) {
      const { allowErrorPayload = false, ...requestOptions } = options;
      const response = await fetch(`${API_ROOT}${path}`, {
        credentials: "same-origin",
        headers: { 
          "Content-Type": "application/json", 
          "X-CSRFToken": getCookie("csrftoken"),
          ...(requestOptions.headers || {}) 
        },
        ...requestOptions,
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok || (payload.ok === false && !allowErrorPayload)) {
        throw new Error(payload.error || `Request failed with ${response.status}`);
      }
      return payload;
    }

    function roomById(roomId) {
      return rooms.find((room) => room.id === roomId) || null;
    }

    function renderRooms(token = "") {
      const filtered = rooms.filter((entry) => {
        const matchesToken = !token || [entry.id, entry.label, entry.meta].some((value) => String(value || "").toLowerCase().includes(token.toLowerCase()));
        const matchesRegion = !selectedRegion || roomRegion(entry) === selectedRegion;
        return matchesToken && matchesRegion;
      });
      renderSelector(roomList, filtered, selectedRoomId, (roomId, label, meta) => selectRoom(roomId, label, meta), (entry) => ({ title: entry.label || entry.id, meta: entry.id }));
    }

    function selectedRoomIsPersisted() {
      return Boolean(selectedRoomId && roomById(selectedRoomId));
    }

    function graphRooms() {
      return rooms.filter((room) => roomRegion(room) === selectedRegion);
    }

    function graphExits(visibleRooms) {
      const visibleIds = new Set(visibleRooms.map((room) => room.id));
      return exits.filter((exit) => visibleIds.has(exit.source) || visibleIds.has(exit.destination));
    }

    function populateRegionFilter() {
      const regions = Array.from(new Set(rooms.map(roomRegion))).sort((left, right) => left.localeCompare(right));
      const previous = selectedRegion || regionFilter.value || regions[0] || "";
      regionFilter.innerHTML = "";
      for (const region of regions) {
        const option = document.createElement("option");
        option.value = region;
        option.textContent = region;
        if (region === previous) option.selected = true;
        regionFilter.appendChild(option);
      }
      selectedRegion = regions.includes(previous) ? previous : regions[0] || "";
      if (selectedRegion) regionFilter.value = selectedRegion;
    }

    function computeGraphLayout(visibleRooms) {
      const xs = visibleRooms.map((room) => Number(room.map_x || 0));
      const ys = visibleRooms.map((room) => Number(room.map_y || 0));
      const minX = xs.length ? Math.min(...xs) : 0;
      const maxX = xs.length ? Math.max(...xs) : 0;
      const minY = ys.length ? Math.min(...ys) : 0;
      const maxY = ys.length ? Math.max(...ys) : 0;
      const width = Math.max(1200, (maxX - minX + 1) * MAP_STEP + GRAPH_MARGIN * 2);
      const height = Math.max(800, (maxY - minY + 1) * MAP_STEP + GRAPH_MARGIN * 2);
      return {
        width,
        height,
        originX: GRAPH_MARGIN - minX * MAP_STEP,
        originY: GRAPH_MARGIN + maxY * MAP_STEP,
      };
    }

    function roomPoint(room, layout) {
      return {
        x: layout.originX + Number(room.map_x || 0) * MAP_STEP,
        y: layout.originY - Number(room.map_y || 0) * MAP_STEP,
      };
    }

    function inferExitKey(source, destination) {
      const dx = Number(destination.map_x || 0) - Number(source.map_x || 0);
      const dy = Number(destination.map_y || 0) - Number(source.map_y || 0);
      if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "east" : "west";
      if (dy !== 0) return dy > 0 ? "north" : "south";
      return "path";
    }

    function shortDirectionAlias(key) {
      return { north: "n", south: "s", east: "e", west: "w", up: "u", down: "d" }[key] || "";
    }

    function normalizeDirection(key) {
      return { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" }[key] || key || "path";
    }

    function oppositeDirection(key) {
      return { north: "south", south: "north", east: "west", west: "east", up: "down", down: "up", in: "out", out: "in" }[normalizeDirection(key)] || "back";
    }

    function buildExitAliases(key, destination) {
      const aliases = [];
      const shortAlias = shortDirectionAlias(key);
      if (shortAlias) aliases.push(shortAlias);
      const label = String((destination && (destination.label || destination.id)) || "").trim().toLowerCase();
      if (label) aliases.push(label);
      return Array.from(new Set(aliases));
    }

    function buildGraphExitDraft(sourceId, destinationId) {
      const source = roomById(sourceId);
      const destination = roomById(destinationId);
      const key = source && destination ? inferExitKey(source, destination) : "path";
      return {
        aliases: buildExitAliases(key, destination),
        direction: key,
        label: destination ? (destination.label || destination.id) : "",
        id: `${sourceId}_to_${destinationId}`,
        key,
        source: sourceId,
        destination: destinationId,
      };
    }

    function buildReverseExitDraft(exitDraft) {
      const source = roomById(exitDraft.destination);
      const destination = roomById(exitDraft.source);
      const key = oppositeDirection(exitDraft.key || exitDraft.direction);
      return {
        aliases: buildExitAliases(key, destination),
        direction: key,
        label: destination ? (destination.label || destination.id) : "",
        id: `${exitDraft.destination}_to_${exitDraft.source}`,
        key,
        source: exitDraft.destination,
        destination: exitDraft.source,
      };
    }

    function buildTwoWayExitDraft(sourceId, destinationId) {
      const forward = buildGraphExitDraft(sourceId, destinationId);
      return { forward, reverse: buildReverseExitDraft(forward) };
    }

    function setWorldMode(mode) {
      worldMode = mode;
      connectMode = mode === "path";
      if (mode !== "path") connectSourceRoomId = "";
      for (const button of modeButtons) {
        button.classList.toggle("active", button.id === `mode-${mode}`);
      }
      if (mode === "issues") {
        graphIssues.scrollIntoView({ block: "nearest" });
      }
      renderGraph();
    }

    function renderPathPreview() {
      if (!pathDraft) {
        pathPreview.textContent = "Choose a source and destination to preview a path.";
        return;
      }
      const forwardKey = normalizeDirection(pathForwardKeyInput.value.trim() || pathDraft.forward.key);
      const reverseKey = normalizeDirection(pathReverseKeyInput.value.trim() || pathDraft.reverse.key);
      pathDraft.forward.key = forwardKey;
      pathDraft.forward.direction = forwardKey;
      pathDraft.forward.aliases = buildExitAliases(forwardKey, roomById(pathDraft.forward.destination));
      pathDraft.reverse.key = reverseKey;
      pathDraft.reverse.direction = reverseKey;
      pathDraft.reverse.aliases = buildExitAliases(reverseKey, roomById(pathDraft.reverse.destination));
      const reverseText = pathOneWayInput.checked ? "No reverse exit will be saved." : `${pathDraft.reverse.source} --${reverseKey}--> ${pathDraft.reverse.destination}`;
      pathPreview.textContent = `${pathDraft.forward.source} --${forwardKey}--> ${pathDraft.forward.destination}. ${reverseText}`;
    }

    function stagePathDraft(sourceId, destinationId, options = {}) {
      if (!sourceId || !destinationId || sourceId === destinationId) {
        setStatus("Choose two different rooms for a path.", "bad");
        return null;
      }
      pathDraft = buildTwoWayExitDraft(sourceId, destinationId);
      pathOneWayInput.checked = Boolean(options.oneWay);
      fillRoomSelect(pathSourceSelect, sourceId);
      fillRoomSelect(pathDestinationSelect, destinationId);
      pathForwardKeyInput.value = pathDraft.forward.key;
      pathReverseKeyInput.value = pathDraft.reverse.key;
      renderPathPreview();
      selectedExitId = pathDraft.forward.id;
      populateExitForm(pathDraft.forward);
      exitJson.value = JSON.stringify(pathDraft.forward, null, 2);
      setEditorTab("exits");
      renderWorldEditors();
      renderGraph();
      setStatus(`Path staged: ${sourceId} to ${destinationId}. Two-way is on unless you mark it one-way.`, "good");
      return pathDraft;
    }

    function stageExitDraft(draft, message = "") {
      setEditorTab("exits");
      selectedExitId = draft.id || "";
      populateExitForm(draft);
      exitJson.value = JSON.stringify(draft, null, 2);
      renderWorldEditors();
      renderGraph();
      setStatus(message || `Drafted exit ${draft.id}. Preview or save it from Outgoing Exits.`, "good");
    }

    function stageEntityDraft(draft, message = "") {
      setEditorTab("entities");
      selectedEntityId = draft.id || "";
      populateEntityForm(draft);
      entityJson.value = JSON.stringify(draft, null, 2);
      renderWorldEditors();
      setStatus(message || `Drafted room object ${draft.id}. Preview or save it from Room Entities.`, "good");
    }

    function applyWorldIncoming(incoming) {
      const payload = incoming.payload || {};
      if (incoming.kind === "room-activity") {
        const current = selectedRoomId ? getRoomFormData() : {};
        const roomId = payload.id || payload.room_id || current.id || selectedRoomId || "new_activity_room";
        const activities = Array.from(new Set([...(current.activities || current.brave_activities || []), ...(payload.activities || [])].filter(Boolean)));
        const draft = {
          ...current,
          ...payload,
          id: roomId,
          key: payload.key || current.key || roomId.replace(/_/g, " "),
          desc: payload.desc || current.desc || "Room activity staged from another Creator builder.",
          zone: payload.zone || current.zone || selectedRegion || "Unmapped",
          world: payload.world || current.world || "Brave",
          map_region: payload.map_region || current.map_region || current.zone || selectedRegion || "Unmapped",
          map_x: Number(payload.map_x ?? current.map_x ?? 0),
          map_y: Number(payload.map_y ?? current.map_y ?? 0),
          activities,
        };
        selectedRoomId = roomId;
        populateRoomForm(draft);
        roomJson.value = JSON.stringify(draft, null, 2);
        setEditorTab("room");
        renderWorldEditors();
        setStatus(`Applied ${incoming.label || "room activity"} to the room form. Preview or Save when ready.`, "good");
        return true;
      }
      if (incoming.kind === "boss-exit") {
        const source = payload.source || selectedRoomId || exitSourceSelect.value || "";
        const destination = payload.destination || exitDestinationSelect.value || "";
        const key = payload.key || payload.direction || "forward";
        const draft = {
          ...payload,
          id: payload.id || `${source || "source"}_to_${destination || "destination"}_${payload.boss_gate || "boss_gate"}`,
          key,
          direction: payload.direction || key,
          label: payload.label || "Boss Gate",
          source,
          destination,
          boss_gate: payload.boss_gate || payload.gate_key || payload.key || "",
        };
        stageExitDraft(draft, `Applied ${incoming.label || "boss-gate exit"} to the exit form. Preview or Save when ready.`);
        return true;
      }
      if (["world-readable", "world-npc"].includes(incoming.kind)) {
        const draft = {
          aliases: [],
          desc: payload.desc || "",
          gender: payload.gender || (incoming.kind === "world-npc" ? "nonbinary" : ""),
          id: payload.id || `${selectedRoomId || "room"}_${incoming.kind === "world-readable" ? "readable" : "npc"}`,
          key: payload.key || (incoming.kind === "world-readable" ? "Readable" : "NPC"),
          kind: payload.kind || (incoming.kind === "world-readable" ? "readable" : "npc"),
          location: payload.location || payload.room_id || selectedRoomId || "",
        };
        stageEntityDraft(draft, `Applied ${incoming.label || "entity"} to the entity form. Preview or Save when ready.`);
        return true;
      }
      return false;
    }
    creatorTools.registerApplyHandler("room-activity", applyWorldIncoming);
    creatorTools.registerApplyHandler("boss-exit", applyWorldIncoming);
    creatorTools.registerApplyHandler("world-readable", applyWorldIncoming);
    creatorTools.registerApplyHandler("world-npc", applyWorldIncoming);

    function buildRoomDraft(mapX = 0, mapY = 0, region = "") {
      const safeRegion = region || selectedRegion || roomRegion(rooms[0] || {}) || "Unmapped";
      return {
        id: `new_room_${mapX}_${mapY}`,
        key: "New Room",
        zone: safeRegion,
        world: "Brave",
        map_region: safeRegion,
        map_x: mapX,
        map_y: mapY,
        desc: "",
      };
    }

    function hideGraphMenu() {
      graphMenu.classList.remove("open");
      graphMenu.setAttribute("aria-hidden", "true");
      pendingGraphDraft = null;
    }

    function roomDraftFromPoint(clientX, clientY) {
      const visibleRooms = graphRooms();
      const layout = computeGraphLayout(visibleRooms.length ? visibleRooms : rooms);
      const rect = graphWrap.getBoundingClientRect();
      const contentX = clientX - rect.left + graphWrap.scrollLeft;
      const contentY = clientY - rect.top + graphWrap.scrollTop;
      const mapX = Math.round((contentX - layout.originX) / MAP_STEP);
      const mapY = Math.round((layout.originY - contentY) / MAP_STEP);
      return buildRoomDraft(mapX, mapY, selectedRegion || regionFilter.value);
    }

    function openGraphMenu(clientX, clientY, roomId = "") {
      pendingGraphDraft = roomDraftFromPoint(clientX, clientY);
      const isOverlap = rooms.some(r => r.map_x === pendingGraphDraft.map_x && r.map_y === pendingGraphDraft.map_y && r.map_region === pendingGraphDraft.map_region);

      graphMenuAddRoom.disabled = isOverlap;
      graphMenuAddRoom.style.display = roomId ? "none" : "block";
      graphMenuAddRoom.textContent = isOverlap ? `Occupied (${pendingGraphDraft.map_x}, ${pendingGraphDraft.map_y})` : "Add Room Here";

      graphMenuDeleteRoom.style.display = roomId ? "block" : "none";
      graphMenuDeleteRoom.dataset.roomId = roomId;

      graphMenu.style.left = `${clientX - graphWrap.getBoundingClientRect().left + graphWrap.scrollLeft}px`;
      graphMenu.style.top = `${clientY - graphWrap.getBoundingClientRect().top + graphWrap.scrollTop}px`;
      graphMenu.classList.add("open");
      graphMenu.setAttribute("aria-hidden", "false");
    }

    function createRoomFromDraft(draft) {
      setEditorTab("room");
      selectedRoomId = draft.id;
      selectedExitId = "";
      selectedEntityId = "";
      previewPayload = { room: draft, exits: [], entities: [], encounters: [] };
      selectedRegion = draft.map_region;
      populateRoomForm(draft);
      roomJson.value = JSON.stringify(draft, null, 2);
      editorTitle.textContent = "New Room Draft";
      editorSubtitle.textContent = `Draft room at ${draft.map_x}, ${draft.map_y} in ${draft.map_region}.`;
      pendingRoomPosition = null;
      renderRooms(roomSearch.value);
      renderGraph();
      renderWorldEditors();
      setStatus(`Staged new room draft at ${draft.map_x}, ${draft.map_y}.`, "good");
    }

    function collectGraphIssues(visibleRooms, visibleExits) {
      const visibleIds = new Set(visibleRooms.map((room) => room.id));
      const allRoomIds = new Set(rooms.map((room) => room.id));
      const outgoingPairs = new Set(exits.map((exit) => `${exit.source}->${exit.destination}`));
      const coordinateOwners = new Map();
      const issues = [];
      for (const room of visibleRooms) {
        if (!room.has_desc) issues.push(`Room ${room.id} is missing a description.`);
        const key = `${Number(room.map_x || 0)},${Number(room.map_y || 0)}`;
        const current = coordinateOwners.get(key) || [];
        current.push(room.id);
        coordinateOwners.set(key, current);
      }
      for (const [coordinates, roomIds] of coordinateOwners.entries()) {
        if (roomIds.length > 1) issues.push(`Overlapping rooms at ${coordinates}: ${roomIds.join(", ")}`);
      }
      for (const exit of visibleExits) {
        if (!allRoomIds.has(exit.source)) issues.push(`Exit ${exit.id} has missing source ${exit.source}`);
        if (!allRoomIds.has(exit.destination)) issues.push(`Exit ${exit.id} has missing destination ${exit.destination}`);
        if (visibleIds.has(exit.source) && visibleIds.has(exit.destination) && !outgoingPairs.has(`${exit.destination}->${exit.source}`)) {
          issues.push(`One-way exit ${exit.id}: ${exit.source} -> ${exit.destination}`);
        }
      }
      return issues;
    }

    function renderGraphIssues(issues) {
      graphIssues.innerHTML = "";
      for (const issue of issues.slice(0, 10)) {
        const line = document.createElement("div");
        line.textContent = issue;
        graphIssues.appendChild(line);
      }
      if (issues.length > 10) {
        const line = document.createElement("div");
        line.textContent = `${issues.length - 10} more issue(s).`;
        graphIssues.appendChild(line);
      }
    }

    function drawQuestThreads(visibleRooms, layout, container) {
      const questToRooms = new Map();
      for (const room of visibleRooms) {
        for (const questId of (room.involved_quests || [])) {
          const list = questToRooms.get(questId) || [];
          list.push(room);
          questToRooms.set(questId, list);
        }
      }
      for (const [questId, rooms] of questToRooms.entries()) {
        if (rooms.length < 2) continue;
        for (let i = 0; i < rooms.length - 1; i++) {
          const r1 = rooms[i];
          const r2 = rooms[i+1];
          const p1 = roomPoint(r1, layout);
          const p2 = roomPoint(r2, layout);
          const x1 = p1.x + NODE_WIDTH / 2;
          const y1 = p1.y + NODE_HEIGHT / 2;
          const x2 = p2.x + NODE_WIDTH / 2;
          const y2 = p2.y + NODE_HEIGHT / 2;
          const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("class", "quest-thread");
          line.setAttribute("x1", x1);
          line.setAttribute("y1", y1);
          line.setAttribute("x2", x2);
          line.setAttribute("y2", y2);
          line.innerHTML = `<title>Quest: ${questId}</title>`;
          container.appendChild(line);
        }
      }
    }

    function drawExitLine(exit, layout, visibleIds, outgoingPairs) {
      const source = roomById(exit.source);
      const destination = roomById(exit.destination);
      const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      const sourceVisible = source && visibleIds.has(source.id);
      const destinationVisible = destination && visibleIds.has(destination.id);
      if (!sourceVisible || !destinationVisible) {
        line.setAttribute("class", "graph-line dangling");
        return line;
      }
      const start = roomPoint(source, layout);
      const end = roomPoint(destination, layout);
      const x1 = start.x + NODE_WIDTH / 2;
      const y1 = start.y + NODE_HEIGHT / 2;
      const x2 = end.x + NODE_WIDTH / 2;
      const y2 = end.y + NODE_HEIGHT / 2;
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      const oneWay = !outgoingPairs.has(`${exit.destination}->${exit.source}`);
      line.setAttribute("class", `graph-line${oneWay ? " one-way" : ""}`);
      line.setAttribute("d", `M ${x1} ${y1} Q ${midX} ${midY - 22} ${x2} ${y2}`);
      return line;
    }

    function renderGraph() {
      const visibleRooms = graphRooms();
      if (selectedRoomId && selectedRoomId.startsWith("new_room_") && !rooms.find(r => r.id === selectedRoomId)) {
        try {
          const draft = getRoomFormData();
          if (draft && draft.map_region === (selectedRegion || regionFilter.value)) {
            visibleRooms.push(draft);
          }
        } catch (e) {}
      }
      const visibleExits = graphExits(visibleRooms);
      try {
        const draft = getExitFormData();
        if (draft && draft.id && draft.source && draft.destination) {
          if (!visibleExits.find(e => e.id === draft.id)) {
            visibleExits.push(draft);
          }
        }
      } catch (e) {}
      if (pathDraft) {
        for (const draft of [pathDraft.forward, pathOneWayInput.checked ? null : pathDraft.reverse].filter(Boolean)) {
          if (!visibleExits.find(e => e.id === draft.id)) visibleExits.push({ ...draft, draft: true });
        }
      }
      const visibleIds = new Set(visibleRooms.map((room) => room.id));
      const outgoingPairs = new Set(exits.map((exit) => `${exit.source}->${exit.destination}`));
      const layout = computeGraphLayout(visibleRooms);
      worldGraph.style.width = `${layout.width}px`;
      worldGraph.style.height = `${layout.height}px`;
      graphLines.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
      graphLines.innerHTML = "";
      for (const exit of visibleExits) {
        const line = drawExitLine(exit, layout, visibleIds, outgoingPairs);
        if (line.hasAttribute("d")) graphLines.appendChild(line);
      }
      
      if (toggleQuests.checked) {
        drawQuestThreads(visibleRooms, layout, graphLines);
      }
      for (const existing of Array.from(worldGraph.querySelectorAll(".room-node"))) existing.remove();
      const issues = collectGraphIssues(visibleRooms, visibleExits);
      const warningIds = new Set();
      for (const issue of issues) {
        for (const room of visibleRooms) {
          if (issue.includes(room.id)) warningIds.add(room.id);
        }
      }
      for (const room of visibleRooms) {
        const isDraft = String(room.id).startsWith("new_room_");
        const isActive = room.id === selectedRoomId;
        const point = roomPoint(room, layout);
        const node = document.createElement("div");
        node.className = [
          "room-node",
          isActive ? "active" : "",
          room.id === connectSourceRoomId ? "connect-source" : "",
          warningIds.has(room.id) ? "warning" : "",
          isDraft ? "draft" : "",
        ].filter(Boolean).join(" ");
        node.style.left = `${point.x}px`;
        node.style.top = `${point.y}px`;
        node.dataset.roomId = room.id;

        const content = document.createElement("div");
        content.className = "room-node-content";

        const title = document.createElement("strong");
        title.textContent = room.label || room.id;
        const meta = document.createElement("span");
        meta.textContent = isDraft ? "Draft Room" : `${room.id} @ ${Number(room.map_x || 0)}, ${Number(room.map_y || 0)}`;
        content.appendChild(title);
        content.appendChild(meta);
        node.appendChild(content);

        const iconContainer = document.createElement("div");
        iconContainer.className = "node-icons";
        
        if (toggleIcons.checked) {
          if (room.activities && room.activities.includes("fishing")) {
            const icon = document.createElement("div");
            icon.className = "node-icon";
            icon.textContent = "🎣";
            icon.title = "Fishing Spot";
            iconContainer.appendChild(icon);
          }
          if (room.activities && room.activities.includes("cooking")) {
            const icon = document.createElement("div");
            icon.className = "node-icon";
            icon.textContent = "🍳";
            icon.title = "Cooking Station";
            iconContainer.appendChild(icon);
          }
        }

        if (toggleIssues.checked && warningIds.has(room.id)) {
          const icon = document.createElement("div");
          icon.className = "node-icon issue";
          icon.textContent = "!";
          icon.title = "Validation Issue";
          iconContainer.appendChild(icon);
        }

        if (toggleHeat.checked && room.encounter_count > 0) {
          if (room.encounter_count >= 3) node.classList.add("heat-high");
          else if (room.encounter_count >= 2) node.classList.add("heat-med");
          else node.classList.add("heat-low");
        }

        node.appendChild(iconContainer);

        content.addEventListener("click", () => handleGraphRoomClick(room.id));
        content.addEventListener("pointerdown", (event) => startRoomDrag(event, room.id, layout));
        node.addEventListener("contextmenu", (event) => openRoomMenu(event, room.id));

        if (isActive) {
          const directions = [
            { key: "n", label: "↑", dx: 0, dy: 1 },
            { key: "s", label: "↓", dx: 0, dy: -1 },
            { key: "e", label: "→", dx: 1, dy: 0 },
            { key: "w", label: "←", dx: -1, dy: 0 },
          ];
          for (const dir of directions) {
            const handle = document.createElement("div");
            handle.className = `node-handle ${dir.key}`;
            handle.textContent = dir.label;
            handle.title = `Draft ${dir.key.toUpperCase()} exit or adjacent room`;
            handle.addEventListener("click", (e) => {
              e.stopPropagation();
              quickConnect(room.id, dir.key, dir.dx, dir.dy);
            });
            node.appendChild(handle);
          }
        }

        worldGraph.appendChild(node);
      }
      graphRoomCount.textContent = `Rooms: ${visibleRooms.length}`;
      graphExitCount.textContent = `Exits: ${visibleExits.length}`;
      graphMode.textContent = connectMode ? (connectSourceRoomId ? `Create path from ${connectSourceRoomId}` : "Create path mode") : `${worldMode.charAt(0).toUpperCase()}${worldMode.slice(1)} mode`;
      connectRoomsButton.classList.toggle("active", connectMode);
      writePositionButton.disabled = !pendingRoomPosition;
      renderGraphIssues(issues);
    }

    function fitGraph() {
      const visibleRooms = graphRooms();
      if (!visibleRooms.length) return;
      const layout = computeGraphLayout(visibleRooms);
      const xs = visibleRooms.map((room) => roomPoint(room, layout).x);
      const ys = visibleRooms.map((room) => roomPoint(room, layout).y);
      graphWrap.scrollLeft = Math.max(0, Math.min(...xs) - 120);
      graphWrap.scrollTop = Math.max(0, Math.min(...ys) - 120);
    }

    function setSelectedRegionForRoom(roomId) {
      const room = roomById(roomId);
      if (!room) return;
      const region = roomRegion(room);
      if (region !== selectedRegion) {
        selectedRegion = region;
        regionFilter.value = region;
      }
    }

    async function quickConnect(sourceId, dirKey, dx, dy) {
      const source = roomById(sourceId);
      if (!source) {
        setStatus("Save this room before drafting exits from it.", "bad");
        return;
      }

      const tx = Number(source.map_x || 0) + dx;
      const ty = Number(source.map_y || 0) + dy;
      const region = roomRegion(source);
      let target = rooms.find(r => r.map_x === tx && r.map_y === ty && roomRegion(r) === region);

      setBusy(true);
      try {
        if (!target) {
          createRoomFromDraft(buildRoomDraft(tx, ty, region));
          setStatus(`Staged a new room ${dirKey.toUpperCase()} of ${sourceId}. Save it, then connect the rooms.`, "good");
          return;
        }

        const draft = stagePathDraft(sourceId, target.id, { oneWay: false });
        if (draft) {
          const forwardKey = normalizeDirection(dirKey);
          const reverseKey = oppositeDirection(forwardKey);
          pathForwardKeyInput.value = forwardKey;
          pathReverseKeyInput.value = reverseKey;
          renderPathPreview();
          populateExitForm(pathDraft.forward);
          exitJson.value = JSON.stringify(pathDraft.forward, null, 2);
          setStatus(`Drafted ${forwardKey} path to ${target.id}. Save Path Drafts to write both exits.`, "good");
        }
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally {
        setBusy(false);
      }
    }

    async function handleGraphRoomClick(roomId) {
      if (suppressGraphClick) {
        suppressGraphClick = false;
        return;
      }
      if (connectMode) {
        if (!roomById(roomId)) {
          setStatus("Save this room before connecting it.", "bad");
          return;
        }
        if (!connectSourceRoomId) {
          connectSourceRoomId = roomId;
          renderGraph();
          setStatus(`Choose a destination room for ${roomId}.`);
          return;
        }
        if (connectSourceRoomId === roomId) {
          connectSourceRoomId = "";
          renderGraph();
          setStatus("Connect source cleared.");
          return;
        }
        const sourceId = connectSourceRoomId;
        const source = roomById(sourceId);
        connectSourceRoomId = "";
        connectMode = false;
        worldMode = "select";
        renderGraph();
        renderRooms(roomSearch.value);
        await selectRoom(sourceId, source && source.label, source && source.meta);
        stagePathDraft(sourceId, roomId, { oneWay: false });
        return;
      }
      const room = roomById(roomId);
      selectRoom(roomId, room && room.label, room && room.meta);
    }

    function startRoomDrag(event, roomId, layout) {
      if (connectMode || worldMode !== "move" || event.button !== 0) return;
      const room = roomById(roomId);
      if (!room) return;
      event.preventDefault();
      const startPoint = roomPoint(room, layout);
      draggingRoom = {
        roomId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startLeft: startPoint.x,
        startTop: startPoint.y,
        layout,
        moved: false,
      };
      event.currentTarget.setPointerCapture(event.pointerId);
    }

    function updateRoomDrag(event) {
      if (!draggingRoom) return;
      const room = roomById(draggingRoom.roomId);
      if (!room) return;
      const deltaX = event.clientX - draggingRoom.startClientX;
      const deltaY = event.clientY - draggingRoom.startClientY;
      if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) draggingRoom.moved = true;
      const nextLeft = draggingRoom.startLeft + deltaX;
      const nextTop = draggingRoom.startTop + deltaY;
      const nextX = Math.round((nextLeft - draggingRoom.layout.originX) / MAP_STEP);
      const nextY = Math.round((draggingRoom.layout.originY - nextTop) / MAP_STEP);
      room.map_x = nextX;
      room.map_y = nextY;
      selectedRoomId = room.id;
      pendingRoomPosition = { roomId: room.id, map_x: nextX, map_y: nextY };
      if (room.id === roomIdInput.value) {
        roomMapXInput.value = nextX;
        roomMapYInput.value = nextY;
      }
      renderGraph();
      renderRooms(roomSearch.value);
      setStatus(`Moved ${room.id} to ${nextX}, ${nextY}. Write Position to persist.`, "good");
    }

    function stopRoomDrag() {
      if (!draggingRoom) return;
      const moved = draggingRoom.moved;
      if (moved) suppressGraphClick = true;
      window.setTimeout(() => { draggingRoom = null; }, 1);
    }

    function renderSelector(container, entries, selectedId, onSelect, labelBuilder) {
      container.innerHTML = "";
      for (const entry of entries) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "selector-row" + (entry.id === selectedId ? " active" : "");
        const label = labelBuilder(entry);
        button.innerHTML = `<strong>${label.title}</strong><span>${label.meta}</span>`;
        button.addEventListener("click", () => onSelect(entry.id));
        container.appendChild(button);
      }
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "selector-row";
        empty.innerHTML = `<strong>None</strong><span>No entries for this room yet.</span>`;
        container.appendChild(empty);
      }
    }


    function buildExitDraft() {
      return { aliases: ["n"], direction: "north", id: `${selectedRoomId || "new_room"}_exit_draft`, key: "north", label: "", source: selectedRoomId || "", destination: "" };
    }

    function buildEntityDraft() {
      return { aliases: [], desc: "", gender: "nonbinary", id: `${selectedRoomId || "new_room"}_entity_draft`, key: "New Entity", kind: "npc", location: selectedRoomId || "" };
    }

    function populateRoomForm(payload) {
      roomIdInput.value = payload.id || selectedRoomId || "";
      roomKeyInput.value = payload.key || "";
      roomZoneInput.value = payload.zone || "";
      roomWorldInput.value = payload.world || "Brave";
      roomRegionInput.value = payload.map_region || payload.zone || "";
      roomMapXInput.value = Number(payload.map_x || 0);
      roomMapYInput.value = Number(payload.map_y || 0);
      fillAtmosphereSelect(payload.atmosphere || "");
      roomDescInput.value = payload.desc || "";
    }

    function populateExitForm(payload) {
      fillRoomSelect(exitSourceSelect, payload.source || selectedRoomId || "");
      fillRoomSelect(exitDestinationSelect, payload.destination || "", true);
      exitIdInput.value = payload.id || "";
      exitKeyInput.value = payload.key || "";
      exitDirectionInput.value = payload.direction || payload.key || "";
      exitLabelInput.value = payload.label || "";
      exitAliasesInput.value = formatCsv(payload.aliases || []);
      exitRequiredQuestInput.value = payload.required_quest || "";
      exitLockMessageInput.value = payload.lock_message || "";
      exitBossGateInput.value = payload.boss_gate || payload.brave_boss_gate || "";
      if (payload.source) exitSourceSelect.value = payload.source;
      if (payload.destination) exitDestinationSelect.value = payload.destination;
      renderExitPathSummary(payload);
    }

    function populateEntityForm(payload) {
      fillRoomSelect(entityLocationSelect, payload.location || selectedRoomId || "");
      entityIdInput.value = payload.id || "";
      entityKeyInput.value = payload.key || "";
      entityKindSelect.value = payload.kind || "npc";
      if (payload.location) entityLocationSelect.value = payload.location;
      entityAliasesInput.value = formatCsv(payload.aliases || []);
      entityGenderSelect.value = payload.kind === "npc" ? (payload.gender || "nonbinary") : (payload.gender || "");
      entityDescInput.value = payload.desc || "";
      syncEntityKindFields();
    }

    function getRoomFormData() {
      const existing = parseTextarea(roomJson, "Room");
      const payload = {
        ...existing,
        id: roomIdInput.value.trim(),
        key: roomKeyInput.value.trim(),
        desc: roomDescInput.value.trim(),
        zone: roomZoneInput.value.trim(),
        world: roomWorldInput.value.trim() || "Brave",
        map_region: roomRegionInput.value.trim() || roomZoneInput.value.trim(),
        map_x: Number(roomMapXInput.value || 0),
        map_y: Number(roomMapYInput.value || 0),
      };
      if (roomAtmosphereSelect.value) payload.atmosphere = roomAtmosphereSelect.value;
      else delete payload.atmosphere;
      return payload;
    }

    function syncRoomFormToJson() {
      const payload = getRoomFormData();
      const messages = creatorTools.requireFields([
        { label: "Room id", value: payload.id },
        { label: "Room name", value: payload.key },
        { label: "Room description", value: payload.desc },
        { label: "Zone", value: payload.zone },
        { label: "Map region", value: payload.map_region },
      ]);
      if (!showValidation(messages)) {
        setStatus("Room details are incomplete.", "bad");
        return null;
      }
      clearValidation();
      roomJson.value = JSON.stringify(payload, null, 2);
      return payload;
    }

    function getExitFormData() {
      const existing = parseTextarea(exitJson, "Exit");
      const id = exitIdInput.value.trim();
      const key = exitKeyInput.value.trim();
      const direction = exitDirectionInput.value.trim() || key;
      const destinationId = exitDestinationSelect.value;
      const destinationRoom = roomById(destinationId);
      const isPersisted = exits.some((entry) => entry.id === id);
      const payload = {
        ...existing,
        aliases: parseCsv(exitAliasesInput.value).length ? parseCsv(exitAliasesInput.value) : (!isPersisted ? buildExitAliases(key, destinationRoom) : (existing.aliases || buildExitAliases(key, destinationRoom))),
        direction,
        label: exitLabelInput.value.trim() || (!isPersisted ? ((destinationRoom && (destinationRoom.label || destinationRoom.id)) || "") : (existing.label || (destinationRoom && (destinationRoom.label || destinationRoom.id)) || "")),
        id,
        key,
        source: exitSourceSelect.value,
        destination: destinationId,
      };
      if (exitRequiredQuestInput.value.trim()) payload.required_quest = exitRequiredQuestInput.value.trim();
      else delete payload.required_quest;
      if (exitLockMessageInput.value.trim()) payload.lock_message = exitLockMessageInput.value.trim();
      else delete payload.lock_message;
      if (exitBossGateInput.value.trim()) payload.boss_gate = exitBossGateInput.value.trim();
      else {
        delete payload.boss_gate;
        delete payload.brave_boss_gate;
      }
      return payload;
    }

    function getEntityFormData() {
      const existing = parseTextarea(entityJson, "Entity");
      const payload = {
        ...existing,
        aliases: parseCsv(entityAliasesInput.value),
        desc: entityDescInput.value.trim(),
        id: entityIdInput.value.trim(),
        key: entityKeyInput.value.trim(),
        kind: entityKindSelect.value,
        location: entityLocationSelect.value,
      };
      if (payload.kind === "npc") {
        payload.gender = entityGenderSelect.value;
      } else if (existing.kind !== "npc" && existing.gender) {
        payload.gender = existing.gender;
      } else {
        delete payload.gender;
      }
      return payload;
    }

    function syncExitFormToJson() {
      const payload = getExitFormData();
      const messages = creatorTools.requireFields([
        { label: "Exit id", value: payload.id },
        { label: "Exit key", value: payload.key },
        { label: "Exit source room", value: payload.source },
        { label: "Exit destination room", value: payload.destination },
      ]);
      if (!showValidation(messages)) {
        setStatus("Exit form is incomplete.", "bad");
        return null;
      }
      clearValidation();
      exitJson.value = JSON.stringify(payload, null, 2);
      return payload;
    }

    function syncEntityFormToJson() {
      const payload = getEntityFormData();
      const messages = creatorTools.requireFields([
        { label: "Entity id", value: payload.id },
        { label: "Entity key", value: payload.key },
        { label: "Entity kind", value: payload.kind },
        { label: "Entity location", value: payload.location },
        { label: "Entity description", value: payload.desc },
      ]);
      if (payload.kind === "npc" && !["male", "female", "nonbinary"].includes(String(payload.gender || "").trim())) {
        messages.push("NPC gender must be male, female, or nonbinary.");
      }
      if (!showValidation(messages)) {
        setStatus("Entity form is incomplete.", "bad");
        return null;
      }
      clearValidation();
      entityJson.value = JSON.stringify(payload, null, 2);
      return payload;
    }

    function makeBadge(text, tone = "") {
      const badge = document.createElement("span");
      badge.className = `badge${tone ? ` ${tone}` : ""}`;
      badge.textContent = text;
      return badge;
    }

    function renderExitPathSummary(entry = null) {
      if (!exitReverseStatus) return;
      const exitEntry = entry || (() => {
        try { return getExitFormData(); } catch { return null; }
      })();
      exitReverseStatus.innerHTML = "";
      if (!exitEntry || !exitEntry.source || !exitEntry.destination) {
        exitReverseStatus.appendChild(makeBadge("No path selected"));
        return;
      }
      const reverse = exits.find((item) => item.source === exitEntry.destination && item.destination === exitEntry.source);
      exitReverseStatus.appendChild(makeBadge(`${exitEntry.source} -> ${exitEntry.destination}`));
      exitReverseStatus.appendChild(makeBadge(reverse ? `Reverse Exit: ${reverse.id}` : "Reverse Exit: missing"));
      if (exitEntry.required_quest) exitReverseStatus.appendChild(makeBadge(`Quest gate: ${exitEntry.required_quest}`));
      if (exitEntry.boss_gate || exitEntry.brave_boss_gate) exitReverseStatus.appendChild(makeBadge(`Boss gate: ${exitEntry.boss_gate || exitEntry.brave_boss_gate}`));
    }

    function renderRelatedContent() {
      const related = (previewPayload && previewPayload.related) || {};
      relatedExits.innerHTML = "";
      relatedSystems.innerHTML = "";
      relatedQuests.innerHTML = "";
      const outgoing = (previewPayload && previewPayload.exits) || [];
      const incoming = (previewPayload && previewPayload.incoming_exits) || [];
      relatedExits.appendChild(makeBadge(`Outgoing: ${outgoing.length}`));
      relatedExits.appendChild(makeBadge(`Incoming: ${incoming.length}`));
      const oneWayCount = outgoing.filter((exitData) => exitData.has_reverse_exit === false).length;
      relatedExits.appendChild(makeBadge(`One-way: ${oneWayCount}`));
      for (const activity of related.activities || []) relatedSystems.appendChild(makeBadge(`Activity: ${activity}`));
      if (related.fishing_spot) relatedSystems.appendChild(makeBadge(`Fishing: ${related.fishing_spot.name || selectedRoomId}`));
      for (const gate of related.boss_gates || []) relatedSystems.appendChild(makeBadge(`Boss Gate: ${gate.name || gate.gate_key}`));
      for (const quest of related.quest_links || []) relatedQuests.appendChild(makeBadge(`Quest: ${quest.title || quest.quest_key}`));
      if (!relatedSystems.children.length) relatedSystems.appendChild(makeBadge("No linked systems"));
      if (!relatedQuests.children.length) relatedQuests.appendChild(makeBadge("No quest objectives"));
    }

    async function writePathDraft() {
      if (!pathDraft) {
        const sourceId = pathSourceSelect.value;
        const destinationId = pathDestinationSelect.value;
        if (!stagePathDraft(sourceId, destinationId, { oneWay: pathOneWayInput.checked })) return;
      }
      renderPathPreview();
      const drafts = [pathDraft.forward];
      if (!pathOneWayInput.checked) drafts.push(pathDraft.reverse);
      setBusy(true);
      try {
        for (const draft of drafts) {
          await mutate("exit", draft.id, draft, true);
        }
        setStatus(`Saved ${drafts.length} path draft(s).`, "good");
        await loadRooms();
        if (selectedRoomId) await loadPreview();
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally {
        setBusy(false);
      }
    }

    function renderWorldEditors() {
      const exits = [...((previewPayload && previewPayload.exits) || [])];
      const entities = [...((previewPayload && previewPayload.entities) || [])];
      try {
        const draft = getExitFormData();
        if (selectedExitId && draft.id === selectedExitId && !exits.find((entry) => entry.id === draft.id)) {
          exits.unshift(draft);
        }
      } catch (e) {}
      try {
        const draft = getEntityFormData();
        if (selectedEntityId && draft.id === selectedEntityId && !entities.find((entry) => entry.id === draft.id)) {
          entities.unshift(draft);
        }
      } catch (e) {}
      renderSelector(exitList, exits, selectedExitId, selectExit, (entry) => ({ title: entry.key || entry.id, meta: `${entry.id} -> ${entry.destination || "?"}` }));
      renderSelector(entityList, entities, selectedEntityId, selectEntity, (entry) => ({ title: entry.key || entry.id, meta: `${entry.id} · ${entry.kind || "entity"}` }));
      renderRelatedContent();
      renderExitPathSummary();
      if (!selectedExitId && exits.length) {
        selectExit(exits[0].id, false);
      } else if (!exits.length) {
        const draft = buildExitDraft();
        exitJson.value = JSON.stringify(draft, null, 2);
        populateExitForm(draft);
      }
      if (!selectedEntityId && entities.length) {
        selectEntity(entities[0].id, false);
      } else if (!entities.length) {
        const draft = buildEntityDraft();
        entityJson.value = JSON.stringify(draft, null, 2);
        populateEntityForm(draft);
      }
    }

    async function loadRooms() {
      setBusy(true);
      setStatus("Loading room references...");
      try {
        const [roomPayload, exitPayload, atmospherePayload] = await Promise.all([
          apiFetch("/references/rooms?limit=1000"),
          apiFetch("/references/exits?limit=1000"),
          apiFetch("/references/atmosphere-profiles?limit=1000"),
        ]);
        rooms = roomPayload.results || [];
        exits = exitPayload.results || [];
        atmosphereProfiles = atmospherePayload.results || [];
        fillAtmosphereSelect(roomAtmosphereSelect.value);
        populateRegionFilter();
        fillRoomSelect(exitSourceSelect, selectedRoomId);
        fillRoomSelect(exitDestinationSelect, selectedRoomId);
        fillRoomSelect(entityLocationSelect, selectedRoomId);
        fillRoomSelect(pathSourceSelect, selectedRoomId, true);
        fillRoomSelect(pathDestinationSelect, "", true);
        renderRooms(roomSearch.value);
        renderGraph();
        console.log(`Loaded ${rooms.length} rooms and ${exits.length} exits.`);
        setStatus(`Loaded ${rooms.length} rooms and ${exits.length} exits.`, "good");
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally {
        setBusy(false);
      }
    }

    async function selectRoom(roomId, label, meta) {
      setEditorTab("room");
      selectedRoomId = roomId;
      selectedExitId = "";
      selectedEntityId = "";
      setSelectedRegionForRoom(roomId);
      renderRooms(roomSearch.value);
      renderGraph();
      editorTitle.textContent = label || roomId;
      editorSubtitle.textContent = `${roomId}${meta ? ` · ${meta}` : ""}`;
      await loadPreview();
    }

    function selectExit(exitId, rerender = true) {
      if (rerender) setEditorTab("exits");
      selectedExitId = exitId;
      let currentDraft = null;
      try {
        const draft = getExitFormData();
        if (draft.id === exitId) currentDraft = draft;
      } catch (e) {}
      const entry = ((previewPayload && previewPayload.exits) || []).find((item) => item.id === exitId) || currentDraft || buildExitDraft();
      exitJson.value = JSON.stringify(entry, null, 2);
      populateExitForm(entry);
      if (rerender) renderWorldEditors();
    }

    function selectEntity(entityId, rerender = true) {
      if (rerender) setEditorTab("entities");
      selectedEntityId = entityId;
      let currentDraft = null;
      try {
        const draft = getEntityFormData();
        if (draft.id === entityId) currentDraft = draft;
      } catch (e) {}
      const entry = ((previewPayload && previewPayload.entities) || []).find((item) => item.id === entityId) || currentDraft || buildEntityDraft();
      entityJson.value = JSON.stringify(entry, null, 2);
      populateEntityForm(entry);
      if (rerender) renderWorldEditors();
    }

    async function loadPreview() {
      if (!selectedRoomId) { setStatus("Choose a room first.", "bad"); return; }
      setBusy(true);
      setStatus(`Loading preview for ${selectedRoomId}...`);
      try {
        const payload = await apiFetch("/preview", { method: "POST", body: JSON.stringify({ kind: "room", args: [selectedRoomId] }) });
        previewPayload = payload.preview;
        roomJson.value = JSON.stringify(payload.preview.room, null, 2);
        populateRoomForm(payload.preview.room || {});
        output.textContent = `${payload.preview.room.key || selectedRoomId}\n${payload.preview.exits.length} exit(s), ${payload.preview.entities.length} room object(s), ${payload.preview.encounters.length} encounter hook(s).`;
        renderWorldEditors();
        setStatus(`Loaded world preview for ${selectedRoomId}.`, "good");
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally { setBusy(false); }
    }

    async function mutate(kind, target, payload, write) {
      const result = await apiFetch("/mutate", { method: "POST", body: JSON.stringify({ kind, target, payload, write, stage: "draft" }) });
      output.textContent = result.diff || JSON.stringify(result, null, 2);
      if (write) {
        const errors = result.validation_errors || [];
        if (errors.length) {
          setStatus(`Write completed with ${errors.length} validation issue(s).`, "bad");
          output.textContent = `${result.diff || ""}\n\nValidation errors:\n- ${errors.join("\n- ")}`.trim();
        } else {
          setStatus(`Saved ${kind} ${target} and checked content.`, "good");
          await loadPreview();
          await loadRooms();
        }
      } else {
        setStatus(`Change preview ready for ${kind} ${target}.`, "good");
      }
    }

    function parseTextarea(textarea, label) {
      try {
        return JSON.parse(textarea.value || "{}");
      } catch (error) {
        setStatus(`${label} JSON parse error: ${error.message}`, "bad");
        throw error;
      }
    }

    async function remove(kind, target, write) {
      const result = await apiFetch("/remove", { method: "POST", body: JSON.stringify({ kind, target, write, stage: "draft" }) });
      output.textContent = result.diff || JSON.stringify(result, null, 2);
      if (write) {
        const errors = result.validation_errors || [];
        if (errors.length) {
          setStatus(`Removal completed with ${errors.length} validation issue(s).`, "bad");
          output.textContent = `${result.diff || ""}\n\nValidation errors:\n- ${errors.join("\n- ")}`.trim();
        } else {
          setStatus(`Removed ${kind} ${target} and checked content.`, "good");
          selectedRoomId = "";
          await loadRooms();
        }
      } else {
        setStatus(`Removal preview ready for ${kind} ${target}.`, "good");
      }
    }

    async function deleteRoom(roomId, write) {
      if (!roomId) return;
      if (String(roomId).startsWith("new_room_")) {
        selectedRoomId = "";
        selectedExitId = "";
        selectedEntityId = "";
        renderRooms(roomSearch.value);
        renderGraph();
        setStatus("Cleared draft room.", "good");
        return;
      }
      if (write && !confirm(`Are you sure you want to delete room ${roomId}?`)) return;
      setBusy(true);
      setStatus(write ? `Deleting room ${roomId}...` : `Previewing removal for ${roomId}...`);
      try { await remove("room", roomId, write); } catch (error) { setStatus(error.message, "bad"); output.textContent = error.stack || error.message; } finally { setBusy(false); }
    }

    async function mutateRoom(write) {
      if (!selectedRoomId) return setStatus("Choose a room first.", "bad");
      let payload; try { payload = syncRoomFormToJson(); } catch { return; }
      if (!payload) return;
      setBusy(true);
      const target = payload.id || selectedRoomId;
      setStatus(write ? `Saving room ${target}...` : `Previewing room change for ${target}...`);
      selectedRoomId = target;
      try { await mutate("room", target, payload, write); } catch (error) { setStatus(error.message, "bad"); output.textContent = error.stack || error.message; } finally { setBusy(false); }
    }

    async function writePendingPosition() {
      if (!pendingRoomPosition) return setStatus("Drag a room before writing coordinates.", "bad");
      const target = pendingRoomPosition.roomId;
      setBusy(true);
      setStatus(`Writing map position for ${target}...`);
      try {
        const payload = await apiFetch("/preview", { method: "POST", body: JSON.stringify({ kind: "room", args: [target] }) });
        const roomPayload = {
          ...payload.preview.room,
          map_x: pendingRoomPosition.map_x,
          map_y: pendingRoomPosition.map_y,
        };
        selectedRoomId = target;
        await mutate("room", target, roomPayload, true);
        pendingRoomPosition = null;
        writePositionButton.disabled = true;
        await loadRooms();
        await loadPreview();
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally {
        setBusy(false);
      }
    }

    async function mutateExit(write) {
      if (!selectedRoomId) return setStatus("Choose a room first.", "bad");
      if (!selectedRoomIsPersisted()) return setStatus("Save this room before adding exits.", "bad");
      const synced = syncExitFormToJson();
      if (!synced) return;
      const target = synced.id || selectedExitId;
      setBusy(true);
      setStatus(write ? `Saving exit ${target}...` : `Previewing exit change for ${target}...`);
      try { await mutate("exit", target, synced, write); selectedExitId = target; } catch (error) { setStatus(error.message, "bad"); output.textContent = error.stack || error.message; } finally { setBusy(false); }
    }

    async function mutateEntity(write) {
      if (!selectedRoomId) return setStatus("Choose a room first.", "bad");
      if (!selectedRoomIsPersisted()) return setStatus("Save this room before adding room objects.", "bad");
      const synced = syncEntityFormToJson();
      if (!synced) return;
      const target = synced.id || selectedEntityId;
      setBusy(true);
      setStatus(write ? `Saving room object ${target}...` : `Previewing room object change for ${target}...`);
      try { await mutate("entity", target, synced, write); selectedEntityId = target; } catch (error) { setStatus(error.message, "bad"); output.textContent = error.stack || error.message; } finally { setBusy(false); }
    }

    async function validateContent() {
      setBusy(true);
      setStatus("Validating draft content packs...");
      try {
        const payload = await apiFetch("/validate", { method: "POST", body: JSON.stringify({ stage: "draft" }), allowErrorPayload: true });
        if (payload.errors.length) {
          setStatus(`Validation found ${payload.errors.length} issue(s).`, "bad");
          output.textContent = payload.errors.join("\n");
        } else {
          setStatus("Content validation passed.", "good");
          output.textContent = JSON.stringify(payload, null, 2);
        }
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally { setBusy(false); }
    }

    function stageCurrentPathControls() {
      return stagePathDraft(pathSourceSelect.value, pathDestinationSelect.value, { oneWay: pathOneWayInput.checked });
    }

    async function openPathRoom(roomId) {
      if (!roomId) return setStatus("No room selected for this side of the path.", "bad");
      const room = roomById(roomId);
      if (!room) return setStatus(`Room ${roomId} is not in the loaded references.`, "bad");
      await selectRoom(roomId, room.label, room.meta);
    }

    function stageReverseFromCurrentExit() {
      let draft;
      try {
        draft = getExitFormData();
      } catch {
        return;
      }
      if (!draft || !draft.source || !draft.destination) {
        setStatus("Select an exit with a source and destination first.", "bad");
        return;
      }
      stageExitDraft(buildReverseExitDraft(draft), `Reverse Exit staged for ${draft.destination} -> ${draft.source}.`);
    }

    async function reloadContent() {
      setBusy(true);
      setStatus("Reloading registry from disk...");
      try {
        const payload = await apiFetch("/reload", { method: "POST", body: "{}" });
        setStatus("Content registry reloaded.", "good");
        output.textContent = JSON.stringify(payload, null, 2);
        await loadRooms();
        if (selectedRoomId) await loadPreview();
      } catch (error) {
        setStatus(error.message, "bad");
        output.textContent = error.stack || error.message;
      } finally { setBusy(false); }
    }

    if (roomSearch) roomSearch.addEventListener("input", () => renderRooms(roomSearch.value));
    for (const button of editorTabButtons) {
      button.addEventListener("click", () => setEditorTab(button.dataset.editorTab));
    }
    if (loadButton) loadButton.addEventListener("click", loadPreview);
    if (newRoomButton) newRoomButton.addEventListener("click", () => createRoomFromDraft(roomDraftFromPoint(graphWrap.getBoundingClientRect().left + graphWrap.clientWidth / 2, graphWrap.getBoundingClientRect().top + graphWrap.clientHeight / 2)));
    if (diffRoomButton) diffRoomButton.addEventListener("click", () => mutateRoom(false));
    if (writeRoomButton) writeRoomButton.addEventListener("click", () => mutateRoom(true));
    if (syncExitFormButton) syncExitFormButton.addEventListener("click", () => { if (syncExitFormToJson()) setStatus("Exit source updated.", "good"); });
    if (newExitButton) newExitButton.addEventListener("click", () => stageExitDraft(buildExitDraft(), "New exit draft staged. Preview or save it from Outgoing Exits."));
    if (diffExitButton) diffExitButton.addEventListener("click", () => mutateExit(false));
    if (writeExitButton) writeExitButton.addEventListener("click", () => mutateExit(true));
    if (syncEntityFormButton) syncEntityFormButton.addEventListener("click", () => { if (syncEntityFormToJson()) setStatus("Room object source updated.", "good"); });
    if (newEntityButton) newEntityButton.addEventListener("click", () => stageEntityDraft(buildEntityDraft(), "New room object draft staged. Preview or save it from Room Entities."));
    if (diffEntityButton) diffEntityButton.addEventListener("click", () => mutateEntity(false));
    if (writeEntityButton) writeEntityButton.addEventListener("click", () => mutateEntity(true));
    if (entityKindSelect) entityKindSelect.addEventListener("change", syncEntityKindFields);
    if (validateButton) validateButton.addEventListener("click", validateContent);
    if (reloadButton) reloadButton.addEventListener("click", reloadContent);
    if (reloadRoomsButton) reloadRoomsButton.addEventListener("click", loadRooms);
    if (regionFilter) regionFilter.addEventListener("change", () => { 
      selectedRegion = regionFilter.value; 
      connectSourceRoomId = ""; 
      renderRooms(roomSearch.value);
      renderGraph(); 
      fitGraph(); 
    });
    const openRoomMenu = (event, roomId = "") => {
      event.preventDefault();
      event.stopPropagation();
      hideGraphMenu();
      openGraphMenu(event.clientX, event.clientY, roomId);
    };
    if (graphWrap) graphWrap.addEventListener("contextmenu", openRoomMenu);
    if (graphWrap) graphWrap.addEventListener("click", (event) => {
      if (worldMode !== "add-room") return;
      if (event.target !== graphWrap && event.target !== worldGraph) return;
      createRoomFromDraft(roomDraftFromPoint(event.clientX, event.clientY));
    });
    if (worldGraph) worldGraph.addEventListener("contextmenu", openRoomMenu);
    if (graphMenuAddRoom) graphMenuAddRoom.addEventListener("click", () => {
      if (pendingGraphDraft) createRoomFromDraft(pendingGraphDraft);
      hideGraphMenu();
    });
    if (graphMenuDeleteRoom) graphMenuDeleteRoom.addEventListener("click", () => {
      const roomId = graphMenuDeleteRoom.dataset.roomId;
      if (roomId) deleteRoom(roomId, true);
      hideGraphMenu();
    });
    if (connectRoomsButton) connectRoomsButton.addEventListener("click", () => {
      setWorldMode(worldMode === "path" ? "select" : "path");
      setStatus(worldMode === "path" ? "Create Path mode enabled. Choose a source room." : "Create Path mode disabled.");
    });
    if (modeSelectButton) modeSelectButton.addEventListener("click", () => setWorldMode("select"));
    if (modeAddRoomButton) modeAddRoomButton.addEventListener("click", () => setWorldMode("add-room"));
    if (modePathButton) modePathButton.addEventListener("click", () => setWorldMode("path"));
    if (modeMoveButton) modeMoveButton.addEventListener("click", () => setWorldMode("move"));
    if (modeIssuesButton) modeIssuesButton.addEventListener("click", () => setWorldMode("issues"));
    if (previewPathButton) previewPathButton.addEventListener("click", stageCurrentPathControls);
    if (writePathButton) writePathButton.addEventListener("click", writePathDraft);
    if (pathSourceSelect) pathSourceSelect.addEventListener("change", () => { pathDraft = null; renderPathPreview(); });
    if (pathDestinationSelect) pathDestinationSelect.addEventListener("change", () => { pathDraft = null; renderPathPreview(); });
    if (pathForwardKeyInput) pathForwardKeyInput.addEventListener("input", renderPathPreview);
    if (pathReverseKeyInput) pathReverseKeyInput.addEventListener("input", renderPathPreview);
    if (pathOneWayInput) pathOneWayInput.addEventListener("change", renderPathPreview);
    if (openSourceRoomButton) openSourceRoomButton.addEventListener("click", () => openPathRoom(exitSourceSelect.value));
    if (openDestinationRoomButton) openDestinationRoomButton.addEventListener("click", () => openPathRoom(exitDestinationSelect.value));
    if (createReverseExitButton) createReverseExitButton.addEventListener("click", stageReverseFromCurrentExit);
    if (writePositionButton) writePositionButton.addEventListener("click", writePendingPosition);
    window.addEventListener("pointermove", updateRoomDrag);
    window.addEventListener("pointerup", stopRoomDrag);
    window.addEventListener("resize", hideGraphMenu);
    window.addEventListener("scroll", hideGraphMenu, true);
    fitGraphButton.addEventListener("click", fitGraph);

    museRoomDescButton.addEventListener("click", async () => {
      try {
        setBusy(true);
        const inspiration = await creatorTools.fetchInspiration("room_description", {
          room_id: roomIdInput.value,
          zone: roomZoneInput.value
        });
        if (inspiration && inspiration.desc) {
          roomDescInput.value = inspiration.desc;
          setStatus("The Muse has provided a description.", "good");
        }
      } catch (err) {
        setStatus(err.message, "bad");
      } finally {
        setBusy(false);
      }
    });

    museEntityDescButton.addEventListener("click", async () => {
      try {
        setBusy(true);
        const inspiration = await creatorTools.fetchInspiration("npc", {
          room_id: roomIdInput.value,
          zone: roomZoneInput.value
        });
        if (inspiration) {
          if (inspiration.desc) entityDescInput.value = inspiration.desc;
          if (inspiration.key && !entityKeyInput.value) entityKeyInput.value = inspiration.key;
          setStatus("The Muse has suggested NPC details.", "good");
        }
      } catch (err) {
        setStatus(err.message, "bad");
      } finally {
        setBusy(false);
      }
    });

    ghostRoomButton.addEventListener("click", () => {
      const roomId = roomIdInput.value;
      if (!roomId) return;
      setBusy(true);
      creatorTools.apiFetch("/codex/ghost", { method: "POST", body: JSON.stringify({ room_id: roomId }) })
        .then((payload) => {
          setStatus(payload.message, "good");
        })
        .catch((err) => setStatus(err.message, "bad"))
        .finally(() => setBusy(false));
    });

    [toggleHeat, toggleIcons, toggleIssues, toggleQuests].forEach(cb => cb.addEventListener("change", renderGraph));

    loadRooms().then(fitGraph);
  </script>
</body>
</html>
